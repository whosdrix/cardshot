name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm test
        env:
          CI_BROWSER: "1"
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cardshot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name cardshot -p 3000:3000 cardshot:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/health && break; sleep 1; done
          curl -fs -o og.png "localhost:3000/og?title=Smoke%20test"
          file og.png | grep -q PNG
          docker logs cardshot
