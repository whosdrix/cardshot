name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the request URL (remove your signature) and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From `GET /health`
      placeholder: 0.1.0
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run cardshot?
      options: [Docker, docker compose, Node, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
